[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-platform"
version = "0.1.0"
description = "A modular AI Engineering learning and development platform"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1"
]

[tool.setuptools.packages.find]
where = ["src"]
